spring.application.name=sistema-gestion-inventario

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_inventario?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false